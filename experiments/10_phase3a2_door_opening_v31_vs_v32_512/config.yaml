task:
  mode: binary_door_opening
  question: >-
    Does training on candidate_v3.2 door-opening masks improve validation performance relative to
    candidate_v3.1, with the target generator version as the only intended free variable?
  control_arm: A_candidate_v3_1
  treatment_arm: B_candidate_v3_2
  experimental_variable: door-opening target generator version and its resulting manifest/path only
  target: door_opening (single logit channel)
  target_is_not: >-
    door_symbol. The door leaf/swing symbol is evidence used to locate the opening; it is not the target.
  note_vs_baseline: >-
    This experiment does NOT predict walls. The 01 baseline is a binary wall model
    (8.43% validation foreground); this target is door openings (0.4848% foreground at 512).
    Its IoU is not comparable with any wall IoU in this repository.
