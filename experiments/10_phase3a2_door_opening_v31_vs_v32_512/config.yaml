    B_candidate_v3_2: 1e-4 (ep 1-23) -> 5e-5 (ep 24-30)
  learning_rate_divergence_note: >-
    The schedulers are data-dependent and diverged. Arm A received a second LR reduction at epoch 29
    that arm B never received; arm A's best epoch (30) is two epochs after it. The final A-vs-B gap
    is therefore not attributable to the target version alone.
