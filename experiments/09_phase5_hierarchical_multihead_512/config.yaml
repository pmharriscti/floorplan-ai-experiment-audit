task:
  mode: hierarchical_multihead_512
  question: Can a shared-encoder, task-group-decoder, 8-head model add wall-structure, opening, and fixture outputs while keeping the binary-wall baseline within 0.005 val IoU?
  parent_checkpoint: 01_binary_mitunet best_model.pth (structural_wall target and wall path inherited unchanged)
  targets:
    - structural_wall          # == baseline wall target (Phase 1 wall_region; openings NOT subtracted)
    - wall_boundary            # Phase 2 cache, reused by reference
    - wall_centerline          # Phase 1 cache, reused by reference
    - junction                 # Phase 1 cache, reused by reference
    - endpoint                 # new: disk radius 3 at centerline endpoints
    - door_opening             # Phase 2 cache (top-level Door polygon; panel/swing/leaf excluded)
    - window_opening           # new: top_level_window_polygon_candidate_v2, training dilation 1
    - fixtures                 # new: 9 classes (cabinetry_storage, appliance, toilet_urinal, sink_tap, sauna_bench, fireplace, bathtub_shower_jacuzzi, chimney, other_fixture)
  derived_outputs:
    visible_wall: structural_wall AND NOT raw door AND NOT raw window (derived, not a trained head)
  target_generation_version: cubicasa-hierarchical-multihead-v1
  target_generation_config_hash: 0e8b66cffa20f7ae3539193cf5673f66386dc1f01a66749876118d52e7e6f391
data:
  dataset: CubiCasa5K
  dataset_version: 4
  split_counts:
    train: 4200
    validation: 400
    test: 400
  splits_identical_to_baseline_manifests: true
  input_size: 512
  resize_mode: letterbox
  normalization: ImageNet mean/std
  augmentation: false            # THE ONE DEVIATION from the earlier Phase 5 runs; see README "Root cause"
  augmentation_note: "The June 2026 baseline was not trained with the repository's current geometric augmentations (h/v flip, rot90); fine-tuning under them regressed the wall by 3-5 IoU points in one epoch. Photometric jitter alone was measured as harmless but was also disabled in this run."
  subtract_openings: false
model:
  architecture: HierarchicalMitUNet (MitUNet + MiT-B4 shared encoder; segmentation_models_pytorch Unet decoders with scse attention)
  encoder_name: mit_b4
  initialisation: baseline 01 checkpoint; wall path logit-equivalent at init (max |delta| 0.0)
  decoder_groups:
    wall: [structural_wall]                                    # the baseline decoder, isolated
    geometry: [wall_boundary, wall_centerline, junction, endpoint]
    openings: [door_opening, window_opening]
    fixtures: [fixtures]                                       # 9-channel head
  head_activation: independent sigmoid per head (no softmax)
  head_kernel_size: 3
  parameter_count: 74468332
  added_parameters_over_baseline: 10219668
loss:
  structural_wall: AsymmetricTversky(alpha=0.6, beta=0.4)     # baseline loss, unchanged
  wall_boundary: 0.5 BCE(pos_weight<=15) + 0.5 SoftDice
  wall_centerline: 0.5 BCE(pos_weight<=20) + 0.5 SoftClDice(iters=10)
  junction: SigmoidFocalBCE(alpha=0.75, gamma=2.0, pos_weight<=20)
  endpoint: SigmoidFocalBCE(alpha=0.75, gamma=2.0, pos_weight<=20)
  door_opening: 0.5 SigmoidFocalBCE + 0.5 SoftDice
  window_opening: 0.5 SigmoidFocalBCE + 0.5 SoftDice
  fixtures: mean over 9 classes of 0.5 SigmoidFocalBCE(per-class pos_weight) + 0.5 SoftDice
  task_weights_fixed:
    structural_wall: 0.40
    wall_boundary: 0.08
    wall_centerline: 0.12
    junction: 0.05
    endpoint: 0.03
    door_opening: 0.12
    window_opening: 0.12
    fixtures: 0.08
  weighting_method: fixed        # config default is gradnorm; overridden with --weighting fixed
training:
  total_epochs_configured: 30
  epochs_completed: 30
  stopped_early: false
  warmup:
    epochs: 4
    trainable: new decoders and heads only (encoder and wall path frozen and held in eval mode)
    learning_rate: 0.0001
  joint:
    epochs: 26
    encoder_lr: 0.00001
    wall_path_lr: 0.00001
    new_path_lr: 0.0001
    lr_warmup_epochs: 1          # linear ramp of the inherited groups over the first joint epoch
    scheduler: ReduceLROnPlateau(mode=max, factor=0.5, patience=3) on val gated hierarchical score (never triggered)
    early_stopping_metric: val_gated_hierarchical_score
    early_stopping_patience: 8
  batch_size: 4
  effective_batch_size: 4
  gradient_accumulation_steps: 1
  optimizer: adam
  weight_decay: 0.0
  amp: true
  seed: 42
  steps_per_epoch: 1050
  mean_epoch_seconds: 767.55
